<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/style.css">

    <title>Chapéus</title>

</head>

<body>

    <header>
        <a href="../HTML/mascote.html" class="voltar">← Voltar</a>

        <h1 class="titulo">Meu PlantAmigo</h1>
    </header>

    <main class="paginaChapeus">

        <!-- MASCOTE (o JS q coloca) -->
        <section class="palcoMascote">

            <p class="pontosLoja">
                <i class="icone icone-estrela"></i>
                <span id="pontosLoja">0</span> pontos
            </p>

            <div id="mascoteVisual"></div>

            <p id="nomeChapeuAtual" class="nomeChapeuAtual" aria-live="polite">Sem chapéu</p>
        </section>

        <!-- aqui é a escolha do chapéu -->
        <section class="escolhaChapeus">

            <h2>Escolha um chapéu</h2>
            <p class="textoAuxiliar">
                Toque de novo no chapéu escolhido para tirá-lo.
            </p>

            <div class="opcoesChapeus">

                <button type="button" class="cardChapeu" data-chapeu="cartola" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu1.webp" alt=""></span>
                    <h3>Cartola</h3>
                </button>

                <button type="button" class="cardChapeu" data-chapeu="flores" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu2.webp" alt=""></span>
                    <h3>Coroa de flores</h3>
                </button>

                <button type="button" class="cardChapeu" data-chapeu="laco" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu3.webp" alt=""></span>
                    <h3>Laço</h3>
                </button>

                <button type="button" class="cardChapeu" data-chapeu="helice" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu4.webp" alt=""></span>
                    <h3>Chapéu de hélice</h3>
                </button>

                <button type="button" class="cardChapeu" data-chapeu="coroa" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu5.webp" alt=""></span>
                    <h3>Coroa de cristal</h3>
                </button>

                <button type="button" class="cardChapeu" data-chapeu="sol" aria-pressed="false">
                    <span class="miniaturaChapeu"><img src="../IMG/chapeu6.webp" alt=""></span>
                    <h3>Chapéu de sol</h3>
                </button>

            </div>

        </section>

        <!-- SALVAR -->
        <div class="barraSalvarChapeu">

            <p
                id="mensagemChapeu"
                class="mensagemConfiguracao"
                aria-live="polite"
            ></p>

            <button type="button" id="btnSalvarChapeu" class="btnSalvarChapeu" disabled>
                Escolha um chapéu
            </button>

        </div>

    </main>

    <!-- CONFIRMAR A COMPRA -->
    <dialog id="dialogoCompra" class="dialogoCompra" aria-labelledby="dialogoTitulo">

        <span class="dialogoMiniatura"><img id="dialogoImagem" src="" alt=""></span>

        <h2 id="dialogoTitulo">Comprar chapéu?</h2>
        <p id="dialogoTexto"></p>

        <div class="dialogoBotoes">
            <button type="button" id="btnConfirmarCompra" class="btnSalvarChapeu">Comprar</button>
            <button type="button" id="btnCancelarCompra" class="btnSecundarioChapeu">Agora não</button>
        </div>

    </dialog>

    <script src="../JS/chapeus.js"></script>
    <script src="../JS/loja.js"></script>

</body>
</html>
